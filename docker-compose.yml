# 本地的中间件与应用（app 服务）。
#
# 端口一律绑 127.0.0.1，不要写成 "5433:5432"：那会绑到 0.0.0.0，而 Docker 直接写 iptables 的 DOCKER 链，
# 优先级在 UFW 之前，以为封住的端口其实是开的（OWASP Docker Security RULE #5a）。

services:
  postgres:
    image: postgres:18
    container_name: chainpay-postgres
    environment:
      POSTGRES_DB: chainpay
      POSTGRES_USER: chainpay
      # 本地开发密码，不是密钥；真实密钥永远走环境注入
      POSTGRES_PASSWORD: chainpay_local_dev
    ports:
      - "127.0.0.1:5433:5432"   # 用 5433 避开本机可能已有的 5432
    volumes:
      # PG 18 起卷挂 /var/lib/postgresql，不是它下面的 data/（沿用旧路径容器会反复重启，见 README 末尾）
      - chainpay-pgdata:/var/lib/postgresql
      # 数据卷为空时执行一次 db/init/*.sql，建 chainpay_app 与 chainpay_system；已有的卷不会重跑（改了脚本要 docker compose down -v）
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainpay -d chainpay"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.10
    container_name: chainpay-redis
    ports:
      - "127.0.0.1:6380:6379"   # 6380：避开本机或别的项目可能在跑的 Redis
    # 故意不挂数据卷、关掉持久化：这里只有限流计数和防重放的 nonce，都是几分钟的短期数据。
    # 重启丢了的代价：计数归零（某商户多打一个窗口），nonce 记录没了（时间窗内的重放只剩幂等键挡）。
    # 前提是 Redis 里只放可丢弃的数据；哪天往里放了不能丢的，要么加持久化，要么放回 Postgres
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 应用本身。密钥只从 env_file 来；environment 里只放拓扑与角色（容器网络里中间件叫 postgres / redis，不是 localhost）
  app:
    build:
      context: .
    # 永远跑 chainpay:current：部署脚本把新镜像打成 current、旧的打成 previous，回滚只是换标签（deploy/）。开发直接 build 也打到 current
    image: ${CHAINPAY_IMAGE:-chainpay:current}
    container_name: chainpay-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - env/local.env
    environment:
      # 进程角色，恰好一个。拆成 web + worker 两个服务（进程拆分第 ⑥ 步）之前，唯一的容器以 worker 身份跑，装着全部的活
      SPRING_PROFILES_ACTIVE: worker
      CHAINPAY_DB_URL: jdbc:postgresql://postgres:5432/chainpay
      CHAINPAY_REDIS_HOST: redis
      CHAINPAY_REDIS_PORT: "6379"
      CHAINPAY_PORT: "8095"
      CHAINPAY_MANAGEMENT_PORT: "8096"
      # 容器内主端口要对容器网络开放（宿主发布的是 127.0.0.1:8095 → 容器:8095）
      CHAINPAY_BIND_ADDRESS: "0.0.0.0"
    ports:
      # 只绑回环（RULE #5a）。管理端口 8096 不发布：它只在容器内回环上，HEALTHCHECK 在容器里打
      - "127.0.0.1:8095:8095"
    # RULE #3 去掉全部 Linux 能力（Java 进程一项都不需要）；RULE #4 禁止提权；RULE #8 根文件系统只读，只给 /tmp 一块内存盘
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # RULE #7 限资源：JVM 堆按内存上限的 75% 算（Dockerfile 的 ENTRYPOINT）；进程数上限防 fork 炸弹
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      # 打 readiness（能不能接请求），不打 liveness：库连不上时不给流量，连着不行才重启
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8096/actuator/health/readiness"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 3
    # 容器运行时就是进程管理器：崩了拉起来，人手停的不拉
    restart: unless-stopped

volumes:
  chainpay-pgdata:
    name: chainpay-pgdata
