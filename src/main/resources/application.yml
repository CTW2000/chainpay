spring:
  application:
    name: chainpay

  task:
    scheduling:
      # ★ 每个 @Scheduled 任务至少一条线程 ★（M3-⑤ 演练实测，2026-09-08）
      # Spring 默认只有一条调度线程，索引器（12 秒一轮）和入账任务（30 秒一轮）排队用它：
      # 入账事务等锁时 chain_head 也停了更新，确认数冻结、降级检测不跑、一条 ERROR 都没有。
      # 现在两个任务、留有余量；加定时任务时同步加大，ChainIndexerBootSmokeTest 断言「线程数 ≥ 注册的任务数」。
      pool:
        size: 5

  datasource:
    # 对应 docker-compose.yml 里绑在 127.0.0.1:5433 的 Postgres 18。
    #
    # 主机名必须写 localhost，不能写 127.0.0.1 —— 这是实测出来的，原因未查明：
    #   InetAddress.getByName("127.0.0.1")   → 正常
    #   JDBC 连 jdbc:postgresql://127.0.0.1  → UnknownHostException: 127.0.0.1
    #   JDBC 连 jdbc:postgresql://localhost   → 正常
    # 同一个 JVM、同一个 pgjdbc 42.7.11、同一个数据库，只差主机名写法。
    # 已排除：macOS SOCKS 代理、HTTP(S)_PROXY 环境变量、preferIPv4Stack。
    # 这是「知其然不知其所以然」的修法。查清之后把这段注释换成真正的原因。
    url: ${CHAINPAY_DB_URL:jdbc:postgresql://localhost:5433/chainpay}
    # ★ 运行时用普通角色，不用超级用户 ★（2026-08-31 起）
    # chainpay_app 不是超级用户、不是表的所有者，RLS 对它无条件生效。
    # 角色由 db/init/01-roles.sql 创建；密码同 secret-key / admin-token 一样
    # 故意不给默认值——配错了就起不来，而不是带着开发密码上生产。
    username: ${CHAINPAY_DB_USER:chainpay_app}
    password: ${CHAINPAY_DB_PASSWORD}
    hikari:
      # 故意开小：并发测试时更容易把连接池竞争暴露出来。
      # 池子开得大，很多并发问题会被"恰好没撞上"掩盖过去。
      maximum-pool-size: 10
      connection-timeout: 3000

  data:
    redis:
      # 对应 docker-compose.yml 里绑在 127.0.0.1:6380 的 Redis 8。
      # 主机名同样写 localhost 而不是 127.0.0.1（原因见上面数据源那段注释）。
      host: ${CHAINPAY_REDIS_HOST:localhost}
      port: ${CHAINPAY_REDIS_PORT:6380}
      # ★ 超时必须设，而且要短 ★
      # 不设的话，Redis 挂掉时每个请求都会在这里卡住默认的几十秒，
      # 线程池被耗尽，整个服务跟着一起死 —— 一个「保护措施」把主业务拖垮。
      # 设成 1 秒：Redis 正常时远远够用；Redis 挂了时快速失败、立刻走降级路径。
      timeout: 1s
      connect-timeout: 1s
      lettuce:
        shutdown-timeout: 200ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 迁移用属主身份跑（建表、改策略、授权），和运行时的普通角色分开。
    # Boot 的 spring.flyway.user/password 一旦设置，Flyway 会用自己的连接，不走上面的池。
    user: ${CHAINPAY_FLYWAY_USER:chainpay}
    password: ${CHAINPAY_FLYWAY_PASSWORD}
    # 迁移失败必须让应用启动失败，不能带着半个 schema 跑起来。
    # 这是 flow-pay 部署链条里缺的一格（见 LEARNING-PATH.md M6）。
    validate-on-migrate: true

chainpay:
  # 加密 API secret 用的 AES-256 密钥（Base64 的 32 字节）。
  # 生成：openssl rand -base64 32
  #
  # ★ 故意不给默认值 ★
  # 没设这个环境变量，应用**直接起不来**。这是刻意的：
  # 如果这里写一个默认值，它迟早会被带进生产 —— 而一个人人都知道的默认密钥
  # 等于没有加密，且不会有任何报错，没有人会发现。
  # 「配错了就起不来」远好过「配错了但看起来正常」。
  #
  # 测试用的固定密钥在 src/test/resources/application.yml，只对测试生效。
  secret-key: ${CHAINPAY_SECRET_KEY}

  # 控制面（/admin/**）的管理员令牌。
  # 生成：openssl rand -hex 32
  #
  # 同样故意不给默认值 —— 理由和上面那把密钥一样，而且更强：
  # 这是一把能给任意商户发钥匙的**万能令牌**，一个人人都知道的默认值
  # 等于把开户接口直接开放给所有人。
  #
  # 它不是唯一的防线：AdminAuthFilter 还要求请求来自本机、且未经代理转发。
  # 两层都要有 —— 令牌会出现在部署脚本、CI 变量、终端历史里；
  # 而回环检查在「nginx 与应用同机」的部署下会静默失效。
  admin-token: ${CHAINPAY_ADMIN_TOKEN}

  # M3 · 系统连接：入账、结算这类无人值守、跨所有商户动钱的操作，以独立角色 chainpay_system 连库。
  # 它带 BYPASSRLS：系统权限是连接身份，不再是 Java 里一个谁都能调的开关（TenantScope.asSystem 只剩测试注资在用，M4 删）。
  # 密码同样故意不给默认值。角色由 db/init/01-roles.sql 创建；已有的开发库卷要手工补，见 README「把应用跑起来」。
  system-db:
    username: ${CHAINPAY_SYSTEM_DB_USER:chainpay_system}
    password: ${CHAINPAY_SYSTEM_DB_PASSWORD}
    # 只有定时任务用它，两条连接足够；开小是为了让并发问题暴露（同 spring.datasource.hikari）
    maximum-pool-size: 2
    # 等锁的上限（M3-⑤ 演练实测）。没有它，别的事务握着账本表时入账事务会无限期等下去，还拖住调度线程。
    # 超时按瞬时失败处理：这一轮提前结束、下一轮再来，不进 HELD。5 秒：账本事务都很短，等得更久说明有人握着不该握的锁
    lock-timeout: 5s

  # M2 · 区块索引器（Sepolia）。
  # rpc-url 故意不在这里给：设了环境变量 CHAINPAY_CHAIN_RPC_URL 才装配索引器
  #（ChainIndexerConfig 上的 @ConditionalOnProperty），不设时应用照常启动。
  # 现在用 publicnode 的免 key 节点：https://ethereum-sepolia-rpc.publicnode.com
  # 需要 key 的时候（撞限流、要归档数据）再去 Alchemy / Infura 申请。
  chain:
    chain-name: sepolia
    # ★ 必须加引号 ★ YAML 1.1 把不加引号的 0x 十六进制当整数，转回字符串就成了十进制数（2026-09-03 实测）
    token-address: "0x779877A7B0D9E8603169DdbD7836e478b4624789"   # Sepolia 上的 LINK
    cursor-name: sepolia:link:transfer
    batch-blocks: 100
    # 轮询间隔。Sepolia 12 秒一块，比这快没有意义
    poll-interval: 12s
    # 没有书签时从哪开始（该块视为已处理）。不配 = 没书签就停下，不猜。
    # start-block: 11623000
    # 每次轮询抽几个已 finalized、已索引的块用回执对账（M2-⑤）
    reconcile-samples: 3
    # 连续几次瞬时失败（或审计节点连续几次答不出）后把状态标成 DEGRADED、每轮报错。12 秒一轮，30 次约 6 分钟
    degraded-after-failures: 30
    # 审计节点同样只从环境变量来：CHAINPAY_CHAIN_AUDIT_RPC_URL，可不设

  # M3 · 收款。xpub 故意不在这里给：设了环境变量 CHAINPAY_DEPOSIT_XPUB 才装配收款地址模块；
  # 入账任务还要同时有主节点（chain.rpc-url），两者都有才装配。
  deposit:
    # 入账任务多久跑一轮。finalized 本身落后十几分钟，比 30 秒更勤没有意义
    post-interval: 30s
    # 每轮最多处理几条 FINAL 日志
    batch-size: 50

  # M4 · 付款。热钱包私钥故意不在这里给：设了环境变量 CHAINPAY_PAYOUT_HOT_WALLET_KEY 才装配付款模块；
  # 发送任务还要同时有主节点（chain.rpc-url），两者都有才装配。
  payout:
    # 签进交易里的链号（EIP-155）。Sepolia = 11155111；签错链号的交易别的链不认
    chain-id: 11155111
    # 发送任务多久跑一轮。签了没广播的、排队的都在这一轮里处理；比出块（12 秒）略快即可
    send-interval: 10s
    # 每轮最多签几笔
    batch-size: 10
    # 小费地板（gwei）：节点建议低于它时按它出，太低会一直排不上
    priority-floor-gwei: 1
    # 总费率上限（gwei）：2 × 基础费 + 小费超过它这一轮不发，等回落。Sepolia 平时几 gwei，涌堵时几十
    max-fee-gwei: 100
    # gasLimit 上限：LINK 转账实测 5 万出头，估算 × 1.2 超过它说明这笔交易不正常
    gas-limit-cap: 200000
    # 追踪任务多久跑一轮：问回执、核 FINAL、结算。回执一块一变，比出块略慢即可
    track-interval: 15s
    # 广播后多久还没上链算卡住：同编号加价 25% 再发一笔。Sepolia 12 秒一块，3 分钟约 15 块；太短会白白多付小费
    stuck-after: 3m

logging:
  level:
    # 想看每条 SQL 时把这行打开 —— 账本层的一个核心目的就是"SQL 看得见"
    # org.springframework.jdbc.core: DEBUG
    com.chainpay: DEBUG

server:
  # 8095 而不是 8090：flow-pay 后端占用 8090，两个项目同时开着会撞。
  # 用 ${VAR:默认值} 语法可被环境变量覆盖，换端口不用改代码也不用重新打包：
  #     CHAINPAY_PORT=9099 java -jar target/chainpay-0.1.0-SNAPSHOT.jar
  port: ${CHAINPAY_PORT:8095}
