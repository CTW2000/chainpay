spring:
  application:
    name: chainpay

  datasource:
    # 对应 docker-compose.yml 里绑在 127.0.0.1:5433 的 Postgres 18。
    #
    # 主机名必须写 localhost，不能写 127.0.0.1 —— 这是实测出来的，原因未查明：
    #   InetAddress.getByName("127.0.0.1")   → 正常
    #   JDBC 连 jdbc:postgresql://127.0.0.1  → UnknownHostException: 127.0.0.1
    #   JDBC 连 jdbc:postgresql://localhost   → 正常
    # 同一个 JVM、同一个 pgjdbc 42.7.11、同一个数据库，只差主机名写法。
    # 已排除：macOS SOCKS 代理、HTTP(S)_PROXY 环境变量、preferIPv4Stack。
    # 这是「知其然不知其所以然」的修法。查清之后把这段注释换成真正的原因。
    url: jdbc:postgresql://localhost:5433/chainpay
    username: chainpay
    password: chainpay_local_dev
    hikari:
      # 故意开小：并发测试时更容易把连接池竞争暴露出来。
      # 池子开得大，很多并发问题会被"恰好没撞上"掩盖过去。
      maximum-pool-size: 10
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 迁移失败必须让应用启动失败，不能带着半个 schema 跑起来。
    # 这是 flow-pay 部署链条里缺的一格（见 LEARNING-PATH.md M6）。
    validate-on-migrate: true

chainpay:
  # 加密 API secret 用的 AES-256 密钥（Base64 的 32 字节）。
  # 生成：openssl rand -base64 32
  #
  # ★ 故意不给默认值 ★
  # 没设这个环境变量，应用**直接起不来**。这是刻意的：
  # 如果这里写一个默认值，它迟早会被带进生产 —— 而一个人人都知道的默认密钥
  # 等于没有加密，且不会有任何报错，没有人会发现。
  # 「配错了就起不来」远好过「配错了但看起来正常」。
  #
  # 测试用的固定密钥在 src/test/resources/application.yml，只对测试生效。
  secret-key: ${CHAINPAY_SECRET_KEY}

logging:
  level:
    # 想看每条 SQL 时把这行打开 —— 账本层的一个核心目的就是"SQL 看得见"
    # org.springframework.jdbc.core: DEBUG
    com.chainpay: DEBUG

server:
  # 8095 而不是 8090：flow-pay 后端占用 8090，两个项目同时开着会撞。
  # 用 ${VAR:默认值} 语法可被环境变量覆盖，换端口不用改代码也不用重新打包：
  #     CHAINPAY_PORT=9099 java -jar target/chainpay-0.1.0-SNAPSHOT.jar
  port: ${CHAINPAY_PORT:8095}
