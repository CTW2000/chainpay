# 测试 profile 的覆盖项：主配置先加载，这里只覆盖测试需要不同的几项。
# 文件名必须是 application-test.yml：叫 application.yml 会按类路径资源整份替换主配置而不是合并，主配置里故意开小的连接池在测试里就不生效了。
# 数据源与 Flyway 的凭据由 AbstractPostgresTest 的 @DynamicPropertySource 注入。
chainpay:
  # 固定、公开、只用于测试的密钥，从不加密真实数据：明文 "chainpay-test-key-not-for-prod!!"，正好 32 字节（AES-256）。
  # 绝不能写进 src/main/resources：那就成了会被一路带进生产的默认值
  secret-key: "Y2hhaW5wYXktdGVzdC1rZXktbm90LWZvci1wcm9kISE="

logging:
  level:
    # 本机 env 常开 DEBUG；测试里降回 INFO，否则 Surefire 输出会被淹没
    com.chainpay: INFO

# 管理端口随机：多个 RANDOM_PORT 的上下文并存，钉死 8096 会互相撞
management:
  server:
    port: 0
